<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RUMRUM – Ereignishorizont</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body{
    margin:0;padding:2rem;
    background:#000;color:#fff;
    font-family:system-ui,sans-serif;
    text-align:center;
  }

  .wrap{max-width:900px;margin:0 auto}

  .title{font-size:40px;margin-bottom:18px}

  .nc6 {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 20px 0;
  }

  .nc-line {
    padding: 10px 14px;
    background: #0b0b0b;
    border: 1px solid #222;
    font-size: 18px;
    color: #7dd3fc;
    font-family: system-ui, sans-serif;
  }

  /* Orbit Animation */
  .orbit-canvas {
    margin:20px auto;
    animation: orbitSpin 4s linear infinite;
  }

  @keyframes orbitSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .orbit-run {
    border-color:#7dd3fc;
    animation: orbitPulse 1.2s infinite alternate;
  }

  @keyframes orbitPulse {
    from { background:#0b0b0b; }
    to   { background:#112233; }
  }
</style>
</head>

</div>
